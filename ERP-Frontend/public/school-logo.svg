<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="torchGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Circular Border with Dots -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="100" cy="100" r="88" fill="url(#shieldGrad)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Shield in Center -->
  <path d="M60,62 C60,62 100,50 140,62 C140,95 132,130 100,148 C68,130 60,95 60,62 Z" 
        fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Torch / Flame of Wisdom -->
  <path d="M100,68 C96,75 92,80 94,86 C96,91 100,94 100,94 C100,94 104,91 106,86 C108,80 104,75 100,68 Z" 
        fill="url(#torchGrad)" />
  <path d="M96,94 L104,94 L102,106 L98,106 Z" fill="url(#goldGrad)" />

  <!-- Open Book of Knowledge -->
  <!-- Left Page -->
  <path d="M100,120 C92,114 82,112 72,113 C72,126 82,125 100,131 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1" />
  <!-- Right Page -->
  <path d="M100,120 C108,114 118,112 128,113 C128,126 118,125 100,131 Z" fill="#f8fafc" stroke="url(#goldGrad)" stroke-width="1" />
  <!-- Book Lines -->
  <line x1="77" y1="118" x2="94" y2="122" stroke="#94a3b8" stroke-width="1" />
  <line x1="77" y1="122" x2="94" y2="126" stroke="#94a3b8" stroke-width="1" />
  <line x1="106" y1="122" x2="123" y2="118" stroke="#94a3b8" stroke-width="1" />
  <line x1="106" y1="126" x2="123" y2="122" stroke="#94a3b8" stroke-width="1" />

  <!-- Laurel Leaves (Left) -->
  <path d="M52,90 C49,98 51,108 55,116 C57,113 58,107 55,101 Z" fill="url(#goldGrad)" />
  <path d="M56,114 C55,123 58,131 65,138 C66,134 66,127 61,122 Z" fill="url(#goldGrad)" />
  <path d="M66,136 C67,144 72,151 80,156 C80,152 79,145 73,142 Z" fill="url(#goldGrad)" />

  <!-- Laurel Leaves (Right) -->
  <path d="M148,90 C151,98 149,108 145,116 C143,113 142,107 145,101 Z" fill="url(#goldGrad)" />
  <path d="M144,114 C145,123 142,131 135,138 C134,134 134,127 139,122 Z" fill="url(#goldGrad)" />
  <path d="M134,136 C133,144 128,151 120,156 C120,152 121,145 127,142 Z" fill="url(#goldGrad)" />

  <!-- Stars -->
  <polygon points="100,52 102,56 106,56 103,58 104,62 100,59 96,62 97,58 94,56 98,56" fill="url(#goldGrad)" />
  <polygon points="76,57 77,60 81,60 78,62 79,65 76,63 73,65 74,62 71,60 75,60" fill="url(#goldGrad)" />
  <polygon points="124,57 125,60 129,60 126,62 127,65 124,63 121,65 122,62 119,60 123,60" fill="url(#goldGrad)" />

  <!-- Text Top Arc: RAVINDRA ENGLISH MEDIUM -->
  <path id="textArcTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" stroke="none" />
  <text font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fde047" letter-spacing="1.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      RAVINDRA ENGLISH MEDIUM
    </textPath>
  </text>

  <!-- Text Bottom Arc: HIGH SCHOOL -->
  <path id="textArcBottom" d="M 165,105 A 68,68 0 0,1 35,105" fill="none" stroke="none" />
  <text font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="3.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      HIGH SCHOOL
    </textPath>
  </text>
</svg>
