name: Deploy Backend UAT (Render)

on:
  push:
    branches: [uat, uat-backend]

permissions:
  contents: read

jobs:
  build-migrate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ERP-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ERP-Backend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Run migrations on UAT database
        env:
          UAT_DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
        run: |
          if [ -n "$UAT_DATABASE_URL" ]; then
            DATABASE_URL="$UAT_DATABASE_URL" node db/migrate.js
          else
            echo "UAT_DATABASE_URL secret not set, skipping migrations."
          fi
      - name: Trigger Render UAT Deploy
        env:
          RENDER_DEPLOY_HOOK_UAT: ${{ secrets.RENDER_DEPLOY_HOOK_UAT }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_UAT" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_UAT"
          else
            echo "RENDER_DEPLOY_HOOK_UAT secret not set, skipping deploy hook."
          fi
